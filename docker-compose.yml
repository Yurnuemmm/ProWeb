services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-web_db}
      - DB_USER=${DB_USER:-web_user}
      - DB_PASSWORD=${DB_PASSWORD:-web_password}
    volumes:
      - .:/var/www/html:Z
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: web_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-web_db}
      MYSQL_USER: ${DB_USER:-web_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-web_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
